# ansible_servidor/playbook.yml

---
- name: 1. Configurar y Securizar Servidor Ubuntu
  hosts: vps          # Se aplica a los hosts del grupo [vps] en hosts.ini
  become: yes         # Todas las tareas se ejecutarán con 'sudo'
  vars_files:
    - vars/main.yml   # Carga las variables de nuestro fichero

  tasks:
    # --- BLOQUE 1: INSTALACIÓN DE PAQUETES ---
    - name: Actualizar caché de APT e instalar paquetes esenciales
      apt:
        name:
          - ufw
          - fail2ban
          - unattended-upgrades
        state: present
        update_cache: yes

    # --- BLOQUE 2: CONFIGURACIÓN DEL FIREWALL (UFW) ---
    - name: Denegar todo el tráfico entrante por defecto
      ufw:
        state: enabled
        policy: deny
        direction: incoming

    - name: Permitir tráfico saliente por defecto
      ufw:
        policy: allow
        direction: outgoing

    - name: Permitir conexiones SSH, HTTP y HTTPS
      ufw:
        rule: allow
        proto: tcp
        port: "{{ item }}"
      loop:
        - '22'    # SSH
        - '80'    # HTTP
        - '443'   # HTTPS

    # --- BLOQUE 3: HARDENING DEL SERVICIO SSH ---
    - name: Deshabilitar el login de root por SSH
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
      notify: Reiniciar sshd # Llama al 'handler' para reiniciar el servicio

    - name: Deshabilitar la autenticación por contraseña
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
      notify: Reiniciar sshd

    # --- BLOQUE 4: SERVICIOS DE SEGURIDAD ---
    - name: Asegurar que Fail2Ban esté activo y arrancado
      systemd:
        name: fail2ban
        state: started
        enabled: yes

    - name: Activar actualizaciones de seguridad automáticas
      copy:
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Download-Upgradeable-Packages "1";
          APT::Periodic::AutocleanInterval "7";
          APT::Periodic::Unattended-Upgrade "1";
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: '0644'

    # --- BLOQUE 5: HARDENING DEL SISTEMA ---
    - name: Securizar memoria compartida (fstab)
      mount:
        path: /dev/shm
        src: tmpfs
        fstype: tmpfs
        opts: defaults,noexec,nosuid
        state: present # Asegura que la línea esté en /etc/fstab
      notify: Recargar systemd y remontar shm

  # --- HANDLERS: ACCIONES QUE SE EJECUTAN SOLO SI SON NOTIFICADAS ---
  handlers:
    - name: Reiniciar sshd
      systemd:
        name: sshd
        state: restarted

    - name: Recargar systemd y remontar shm
      shell: |
        systemctl daemon-reload
        mount -o remount /dev/shm
      listen: Recargar systemd y remontar shm