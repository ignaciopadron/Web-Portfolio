name: Build, Push, and Deploy Docker Image

# Trigger: Se activa en cada push a la rama 'master'
on:
  push:
    branches:
      - master
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and load Docker image
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ignaciopadron-portfolio:latest

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/ignaciopadron-portfolio:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/ignaciopadron-portfolio:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Descarga la última versión de la imagen desde Docker Hub
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/ignaciopadron-portfolio:latest

            # 2. Detiene y elimina el contenedor antiguo si existe
            docker stop ignaciopadron-website || true
            docker rm ignaciopadron-website || true

            # 3. (Buena práctica) Limpia imágenes antiguas que no se estén usando para ahorrar espacio
            docker image prune -af

            # 4. Inicia el nuevo contenedor CONECTADO A LA RED DEL PROXY
            #    - SIN mapeo de puertos (-p) porque Nginx Proxy Manager se encarga de eso.
            #    - --network npm_default: Conecta este contenedor a la red de Nginx Proxy Manager.
            #    - --restart always: Asegura que el contenedor se reinicie si el servidor lo hace.
            docker run -d \
              --name ignaciopadron-website \
              --network proxy_network \
              --restart always \
              ${{ secrets.DOCKERHUB_USERNAME }}/ignaciopadron-portfolio:latest